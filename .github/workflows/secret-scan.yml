name: secret-scan

# Server-side credential scan. Runs no matter WHO pushed or HOW — Codex Web,
# a cloud session, a new machine, the GitHub web editor, an API push. The
# client-side .githooks/pre-push cannot cover those: core.hooksPath lives in
# .git/config and never travels with a clone (verified empirically 2026-08-06).
#
# This is DETECTION, not prevention: by the time it runs the commit is already
# on GitHub, and a pushed secret cannot be fully erased (old commits stay
# reachable by SHA). If this job fails, ROTATE the credential — do not merely
# delete the line.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff a range

      - name: Verify the guard is installed (self-healing check)
        run: |
          missing=0
          for f in .githooks/secret-scan.sh .githooks/pre-push; do
            if [ ! -f "$f" ]; then echo "::error::$f is missing"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Secret guard is not installed in this repo."
            echo "Reinstall: yabro-hq/scripts/install-secret-guard.sh --repo <path>"
            exit 1
          fi
          chmod +x .githooks/secret-scan.sh
          echo "guard present"

      - name: Scan pushed commits for credentials
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          Z40=0000000000000000000000000000000000000000
          HEAD_SHA=$(git rev-parse HEAD)

          if [ "$EVENT" = "pull_request" ] && [ -n "${PR_BASE:-}" ]; then
            BASE="$PR_BASE"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$Z40" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            # New branch, force-push, or unavailable base: fall back to the
            # default branch, else scan the whole tree. Never silently skip —
            # a scan that quietly covers nothing is worse than no scan.
            DEF="origin/${{ github.event.repository.default_branch }}"
            if git rev-parse --verify -q "$DEF" >/dev/null 2>&1; then
              BASE=$(git merge-base "$DEF" "$HEAD_SHA" 2>/dev/null || true)
            fi
            if [ -z "${BASE:-}" ] || [ "$BASE" = "$HEAD_SHA" ]; then
              echo "No usable diff base — scanning the FULL tree instead."
              exec ./.githooks/secret-scan.sh --tree "$HEAD_SHA"
            fi
          fi

          echo "Scanning range: $BASE..$HEAD_SHA"
          ./.githooks/secret-scan.sh "$BASE" "$HEAD_SHA"

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::warning::A credential-shaped string reached GitHub."
          echo "ROTATE the credential first — deleting the line is NOT enough."
          echo "Old commits stay reachable by SHA even after a force-push."
